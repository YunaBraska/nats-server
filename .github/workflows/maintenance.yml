name: 🛠️ CI · Maintenance

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run.
        required: true
        default: true
        type: boolean

permissions: {}

jobs:
  maven_wrapper:
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: YunaBraska/YunaBraska/.github/workflows/wc_java_update_maven_wrapper.yml@93dcc244b1713aeb9594aff65df1a2901ded707f
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

  nats_server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
      packages: read
      pull-requests: write
    steps:
      - name: "🧑‍💻 Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          submodules: recursive

      - name: "🔍 Read Java Info"
        id: java_info
        uses: YunaBraska/java-info-action@094dc70cf4050d156dded76d5574c962886c0b0a # v3.0.12

      - name: "☕ Setup Java [${{ steps.java_info.outputs.java_version }}]"
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ steps.java_info.outputs.java_version }}
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: "🛠️ Update NATS Server"
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: sh
        run: |
          set -eu
          branch='bot/maintenance-nats-server'
          if gh pr list --repo "${GITHUB_REPOSITORY}" --head "${branch}" --state open --json number --jq '.[0].number // empty' | grep -q .; then
            echo "${branch} already has an open pull request."
            exit 0
          fi
          ${{ steps.java_info.outputs.cmd }} -B test
          if git diff --quiet -- src/main/java/berlin/yuna/natsserver/config; then
            echo 'NATS Server is current.'
            exit 0
          fi
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}" = 'true' ]; then
            echo "Would create ${branch}."
            exit 0
          fi
          git config user.name 'Kira Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "${branch}"
          git add -- src/main/java/berlin/yuna/natsserver/config
          git commit -m 'build: update NATS server'
          git push origin "${branch}"
          gh pr create --repo "${GITHUB_REPOSITORY}" --base "${{ github.event.repository.default_branch }}" --head "${branch}" --title 'build: update NATS server' --body 'Updates NATS server sources.'
          gh workflow run build-pr.yml --repo "${GITHUB_REPOSITORY}" --ref "${branch}" -f ref="${branch}"
