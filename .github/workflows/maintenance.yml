name: 🛠️ CI · Maintenance

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run.
        required: true
        default: true
        type: boolean

permissions: {}

jobs:
  maven_wrapper:
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: YunaBraska/YunaBraska/.github/workflows/wc_java_update_maven_wrapper.yml@f2c1dd2892f0a2cbba7013fb0be05ba0e7e42bec
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

  upstream:
    permissions:
      actions: write
      contents: write
      packages: read
      pull-requests: write
    uses: YunaBraska/YunaBraska/.github/workflows/wc_java_update_upstream.yml@f2c1dd2892f0a2cbba7013fb0be05ba0e7e42bec
    with:
      upstream_repository: nats-io/nats-server
      maintenance_test_property: nats.version.enum.update=true
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
